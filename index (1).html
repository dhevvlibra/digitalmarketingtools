<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SosmedKit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f3f7);
  --text:var(--tg-theme-text-color,#15171c);
  --hint:var(--tg-theme-hint-color,#7a7f8c);
  --accent:var(--tg-theme-button-color,#2f7cf6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --ok:#1f9d55;--warn:#d98b00;--bad:#d64545;
  --ig:#d62976;--tt:#111111;--fb:#1877f2;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg2);color:var(--text);font-size:15px;padding-bottom:76px}
header{background:var(--bg);padding:14px 16px 10px;position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(0,0,0,.06)}
header h1{margin:0;font-size:18px}
header .sub{color:var(--hint);font-size:13px;margin-top:2px}
.monthbar{display:flex;align-items:center;gap:8px;margin-top:10px}
.monthbar button{border:0;background:var(--bg2);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
.monthbar .label{flex:1;text-align:center;font-weight:600}
main{padding:12px}
.card{background:var(--bg);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--hint);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);display:flex;border-top:1px solid rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;color:var(--hint);font-size:11px;cursor:pointer}
nav button .ic{display:block;font-size:20px;margin-bottom:2px}
nav button.active{color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;color:var(--text);font-size:13px;cursor:pointer}
.seg button.active{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{border:0;background:var(--accent);color:var(--accent-text);padding:11px 14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:var(--bg2);color:var(--text)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.small{width:auto;padding:7px 12px;font-size:13px}
.row{display:flex;gap:8px}
.row>*{flex:1}
label{display:block;font-size:12px;color:var(--hint);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.12);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--hint);text-align:center;padding:4px 0}
.cal .day{background:var(--bg2);border-radius:8px;min-height:52px;padding:4px;font-size:12px;cursor:pointer;position:relative}
.cal .day.empty{background:transparent;cursor:default}
.cal .day.today{outline:2px solid var(--accent)}
.cal .day.sel{background:var(--accent);color:var(--accent-text)}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%}
.p-instagram{background:var(--ig)}.p-tiktok{background:var(--tt)}.p-facebook{background:var(--fb)}
.post{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer}
.post:last-child{border-bottom:0}
.post .bar{width:4px;border-radius:4px}
.post .t{font-weight:600}
.post .m{font-size:12px;color:var(--hint);margin-top:2px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg2);color:var(--text);margin-left:4px}
.s-ide{background:#eceff4}.s-produksi{background:#fff2cc}.s-terjadwal{background:#dbeafe}.s-terposting{background:#d1fae5}
.legend{display:flex;gap:12px;font-size:12px;color:var(--hint);margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
/* kpi */
.kpi{margin-bottom:14px}
.kpi .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.kpi .top b{font-weight:600}
.prog{height:9px;background:var(--bg2);border-radius:9px;overflow:hidden}
.prog>div{height:100%;border-radius:9px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg2);border-radius:12px;padding:10px}
.stat .v{font-size:19px;font-weight:700;margin-top:2px}
.stat .l{font-size:12px;color:var(--hint)}
.stat .d{font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
th{color:var(--hint);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.note{font-size:13px;color:var(--hint);line-height:1.45}
.info{background:#fff7e6;color:#6b4a00;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.ach:last-child{border-bottom:0}
.ach .e{font-size:22px}
.empty-state{text-align:center;color:var(--hint);padding:18px 0;font-size:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:17px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
svg text{fill:var(--hint);font-size:10px}
.hidden{display:none}
.preview{width:100%;max-height:240px;object-fit:contain;border-radius:10px;background:var(--bg2);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>SosmedKit</h1>
  <div class="sub" id="hello">Planner & laporan social media</div>
  <div class="monthbar">
    <button id="prevM" aria-label="Bulan sebelumnya">‹</button>
    <div class="label" id="monthLabel"></div>
    <button id="nextM" aria-label="Bulan berikutnya">›</button>
  </div>
</header>

<main id="view"></main>

<nav id="nav">
  <button data-tab="plan" class="active"><span class="ic">📅</span>Konten</button>
  <button data-tab="target"><span class="ic">🎯</span>Target</button>
  <button data-tab="report"><span class="ic">📊</span>Laporan</button>
  <button data-tab="ads"><span class="ic">💰</span>Meta Ads</button>
  <button data-tab="upload"><span class="ic">⬆️</span>Upload</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== Setup ================== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (tgUser) document.getElementById('hello').textContent = 'Halo, ' + tgUser.first_name + ' 👋';

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const PLATFORM = {instagram:'Instagram',tiktok:'TikTok',facebook:'Facebook'};
const STATUS = {ide:'Ide',produksi:'Produksi',terjadwal:'Terjadwal',terposting:'Terposting'};
const FORMAT = ['Reels','Feed Foto','Carousel','Story','Video TikTok','Live'];
const PILAR = ['Edukasi','Promo','Hiburan','Testimoni','Behind the Scene','Info Produk'];

const today = new Date();
let cur = {y: today.getFullYear(), m: today.getMonth()};
let tab = 'plan', reportSeg = 'bulanan', selDay = null;

const mkey = (y,m) => `${y}-${String(m+1).padStart(2,'0')}`;
const curKey = () => mkey(cur.y,cur.m);
const prevKey = () => cur.m===0 ? mkey(cur.y-1,11) : mkey(cur.y,cur.m-1);
const uid = () => Math.random().toString(36).slice(2,10);
const fmt = n => (n==null||isNaN(n)) ? '-' : Number(n).toLocaleString('id-ID');
const rp = n => 'Rp ' + fmt(Math.round(n||0));
const pct = (a,b) => b ? (a/b*100) : 0;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================== Storage ==================
   Versi pertama menyimpan data di perangkat (localStorage).
   Nanti bisa diganti ke Telegram CloudStorage atau server sendiri. */
const STORE_KEY = 'sosmedkit_v1';
let db = load();
function load(){
  try { const d = JSON.parse(localStorage.getItem(STORE_KEY)); if (d) return d; } catch(e){}
  return seed();
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }

function seed(){
  const k = mkey(today.getFullYear(), today.getMonth());
  const pm = today.getMonth()===0 ? mkey(today.getFullYear()-1,11) : mkey(today.getFullYear(), today.getMonth()-1);
  const d = n => `${k}-${String(n).padStart(2,'0')}`;
  return {
    posts: [
      {id:uid(),date:d(3),platform:'instagram',format:'Reels',pilar:'Edukasi',title:'Tips hemat kuota internet',caption:'5 cara biar internet rumah makin lancar 🚀',status:'terposting'},
      {id:uid(),date:d(5),platform:'tiktok',format:'Video TikTok',pilar:'Hiburan',title:'POV: WiFi lemot pas meeting',caption:'Relate ga? 😅',status:'terposting'},
      {id:uid(),date:d(8),platform:'instagram',format:'Carousel',pilar:'Promo',title:'Promo akhir bulan',caption:'Diskon spesial pelanggan baru!',status:'terposting'},
      {id:uid(),date:d(12),platform:'facebook',format:'Feed Foto',pilar:'Testimoni',title:'Cerita pelanggan setia',caption:'',status:'terposting'},
      {id:uid(),date:d(15),platform:'tiktok',format:'Video TikTok',pilar:'Edukasi',title:'Cara reset router',caption:'',status:'terjadwal'},
      {id:uid(),date:d(19),platform:'instagram',format:'Story',pilar:'Info Produk',title:'Polling paket favorit',caption:'',status:'terjadwal'},
      {id:uid(),date:d(22),platform:'instagram',format:'Reels',pilar:'Behind the Scene',title:'Sehari bareng teknisi',caption:'',status:'produksi'},
      {id:uid(),date:d(26),platform:'tiktok',format:'Video TikTok',pilar:'Hiburan',title:'Trend sound minggu ini',caption:'',status:'ide'},
    ],
    targets: {
      [k]: {followers_ig:12000, followers_tt:8000, reach:150000, er:4.5, posts:20, leads:120, ads_budget:5000000, roas:3}
    },
    metrics: {
      [pm]: {followers_ig:10850, followers_tt:6900, reach:118000, impressions:240000, engagement:4900, leads:85},
      [k]:  {followers_ig:11420, followers_tt:7650, reach:131500, impressions:276000, engagement:6120, leads:97}
    },
    ads: [
      {id:uid(),month:pm,name:'Awareness Okt',objective:'Awareness',spend:3500000,impressions:410000,reach:198000,clicks:3900,results:62,revenue:9800000},
      {id:uid(),month:k,name:'Promo Pelanggan Baru',objective:'Leads',spend:2400000,impressions:260000,reach:140000,clicks:3100,results:58,revenue:8700000},
      {id:uid(),month:k,name:'Retargeting Website',objective:'Traffic',spend:1300000,impressions:120000,reach:52000,clicks:2400,results:21,revenue:4100000},
      {id:uid(),month:k,name:'Video Views Reels',objective:'Awareness',spend:900000,impressions:180000,reach:110000,clicks:950,results:0,revenue:0},
    ]
  };
}

/* ================== UI helpers ================== */
const $ = s => document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); haptic('success'); }
function haptic(type){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type);}catch(e){} }
function openSheet(html){ $('#sheet').innerHTML=html; $('#modal').classList.add('open'); }
function closeSheet(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeSheet(); });

$('#prevM').onclick=()=>{ cur.m--; if(cur.m<0){cur.m=11;cur.y--;} selDay=null; render(); };
$('#nextM').onclick=()=>{ cur.m++; if(cur.m>11){cur.m=0;cur.y++;} selDay=null; render(); };
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));
  render(); window.scrollTo(0,0);
});

function render(){
  $('#monthLabel').textContent = BULAN[cur.m]+' '+cur.y;
  const v = $('#view');
  if(tab==='plan') v.innerHTML = viewPlan();
  if(tab==='target') v.innerHTML = viewTarget();
  if(tab==='report') v.innerHTML = viewReport();
  if(tab==='ads') v.innerHTML = viewAds();
  if(tab==='upload') v.innerHTML = viewUpload();
  bind();
}

/* ================== Hitung data ================== */
function postsOf(key){ return db.posts.filter(p=>p.date.startsWith(key)); }
function adsOf(key){ return db.ads.filter(a=>a.month===key); }
function adsSum(key){
  const s={spend:0,impressions:0,reach:0,clicks:0,results:0,revenue:0};
  adsOf(key).forEach(a=>{ for(const f in s) s[f]+=Number(a[f])||0; });
  s.ctr = pct(s.clicks,s.impressions); s.cpc = s.clicks? s.spend/s.clicks:0;
  s.cpm = s.impressions? s.spend/s.impressions*1000:0; s.cpr = s.results? s.spend/s.results:0;
  s.roas = s.spend? s.revenue/s.spend:0;
  return s;
}
function actuals(key){
  const m = db.metrics[key]||{};
  const posted = postsOf(key).filter(p=>p.status==='terposting').length;
  const followersTotal = (m.followers_ig||0)+(m.followers_tt||0);
  const er = m.reach ? m.engagement/m.reach*100 : 0;
  const a = adsSum(key);
  return {followers_ig:m.followers_ig||0, followers_tt:m.followers_tt||0, reach:m.reach||0, er, posts:posted, leads:m.leads||0, ads_budget:a.spend, roas:a.roas, impressions:m.impressions||0, engagement:m.engagement||0, followersTotal};
}
const KPI_DEF = [
  {k:'followers_ig',label:'Followers Instagram',f:fmt},
  {k:'followers_tt',label:'Followers TikTok',f:fmt},
  {k:'reach',label:'Total Reach',f:fmt},
  {k:'er',label:'Engagement Rate (%)',f:v=>v.toFixed(2)+'%'},
  {k:'posts',label:'Jumlah Posting',f:fmt},
  {k:'leads',label:'Leads / Inquiry',f:fmt},
  {k:'ads_budget',label:'Budget Iklan Terpakai',f:rp,budget:true},
  {k:'roas',label:'ROAS Iklan',f:v=>v.toFixed(2)+'x'},
];
function progColor(p,budget){ if(budget) return p>100?'var(--bad)':'var(--accent)'; return p>=100?'var(--ok)':p>=70?'var(--accent)':'var(--warn)'; }

/* ================== View: Content Planning ================== */
function viewPlan(){
  const first = new Date(cur.y,cur.m,1).getDay(); // 0 Minggu
  const offset = (first+6)%7; // mulai Senin
  const days = new Date(cur.y,cur.m+1,0).getDate();
  const key = curKey(); const posts = postsOf(key);
  let cells = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<offset;i++) cells+='<div class="day empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = `${key}-${String(d).padStart(2,'0')}`;
    const ps = posts.filter(p=>p.date===ds);
    const isToday = today.getFullYear()===cur.y && today.getMonth()===cur.m && today.getDate()===d;
    cells += `<div class="day ${isToday?'today':''} ${selDay===ds?'sel':''}" data-day="${ds}">${d}<div class="dots">${ps.map(p=>`<span class="dot p-${p.platform}"></span>`).join('')}</div></div>`;
  }
  const list = (selDay ? posts.filter(p=>p.date===selDay) : posts).sort((a,b)=>a.date.localeCompare(b.date));
  const cnt = s => posts.filter(p=>p.status===s).length;
  return `
  <div class="card">
    <div class="cal">${cells}</div>
    <div class="legend"><span><i class="dot p-instagram"></i>Instagram</span><span><i class="dot p-tiktok"></i>TikTok</span><span><i class="dot p-facebook"></i>Facebook</span></div>
  </div>
  <div class="card">
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">
      ${Object.keys(STATUS).map(s=>`<div class="stat"><div class="l">${STATUS[s]}</div><div class="v">${cnt(s)}</div></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="row" style="align-items:center;margin-bottom:6px">
      <h2 style="margin:0">${selDay ? 'Konten '+tglIndo(selDay) : 'Semua konten bulan ini'}</h2>
      <div style="flex:0">${selDay?'<button class="btn sec small" id="clearDay">Semua</button>':''}</div>
    </div>
    ${list.length ? list.map(postRow).join('') : '<div class="empty-state">Belum ada konten. Tap tanggal lalu tambah ide.</div>'}
    <button class="btn" id="addPost" style="margin-top:10px">+ Tambah Konten</button>
  </div>`;
}
function tglIndo(ds){ const [y,m,d]=ds.split('-'); return `${+d} ${BULAN[m-1]}`; }
function postRow(p){
  const col = {instagram:'var(--ig)',tiktok:'var(--tt)',facebook:'var(--fb)'}[p.platform];
  return `<div class="post" data-post="${p.id}"><div class="bar" style="background:${col}"></div><div style="flex:1">
    <div class="t">${esc(p.title)}</div>
    <div class="m">${tglIndo(p.date)} · ${PLATFORM[p.platform]} · ${esc(p.format)} · ${esc(p.pilar)} <span class="badge s-${p.status}">${STATUS[p.status]}</span></div>
  </div></div>`;
}
function postForm(p){
  p = p || {date: selDay || `${curKey()}-${String(Math.min(today.getDate(),28)).padStart(2,'0')}`, platform:'instagram', format:'Reels', pilar:'Edukasi', status:'ide', title:'', caption:''};
  const opt = (arr,v) => arr.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
  const optO = (obj,v) => Object.keys(obj).map(x=>`<option value="${x}" ${x===v?'selected':''}>${obj[x]}</option>`).join('');
  openSheet(`<h2>${p.id?'Edit':'Tambah'} Konten</h2>
    <label>Judul / ide konten</label><input id="f_title" value="${esc(p.title)}" placeholder="mis. Tips internet lancar">
    <div class="row"><div><label>Tanggal</label><input type="date" id="f_date" value="${p.date}"></div>
    <div><label>Status</label><select id="f_status">${optO(STATUS,p.status)}</select></div></div>
    <div class="row"><div><label>Platform</label><select id="f_platform">${optO(PLATFORM,p.platform)}</select></div>
    <div><label>Format</label><select id="f_format">${opt(FORMAT,p.format)}</select></div></div>
    <label>Content pillar</label><select id="f_pilar">${opt(PILAR,p.pilar)}</select>
    <label>Caption / brief</label><textarea id="f_caption" placeholder="Tulis caption, hashtag, atau brief untuk desainer">${esc(p.caption)}</textarea>
    <div style="height:12px"></div>
    <button class="btn" id="savePost">Simpan</button>
    ${p.id?`<div style="height:8px"></div><button class="btn sec" id="toUpload">Siapkan untuk Upload</button><button class="btn danger" id="delPost">Hapus konten</button>`:''}
  `);
  $('#savePost').onclick=()=>{
    const data={title:$('#f_title').value.trim()||'Tanpa judul',date:$('#f_date').value,status:$('#f_status').value,platform:$('#f_platform').value,format:$('#f_format').value,pilar:$('#f_pilar').value,caption:$('#f_caption').value};
    if(p.id) Object.assign(db.posts.find(x=>x.id===p.id),data); else db.posts.push({id:uid(),...data});
    save(); closeSheet(); render(); toast('Konten tersimpan');
  };
  if(p.id){
    $('#delPost').onclick=()=>{ db.posts=db.posts.filter(x=>x.id!==p.id); save(); closeSheet(); render(); toast('Konten dihapus'); };
    $('#toUpload').onclick=()=>{ closeSheet(); uploadDraft=p.id; tab='upload'; document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab==='upload')); render(); };
  }
}

/* ================== View: Target ================== */
function viewTarget(){
  const key=curKey(), t=db.targets[key], a=actuals(key);
  if(!t) return `<div class="card"><h2>Target ${BULAN[cur.m]}</h2><div class="empty-state">Belum ada target untuk bulan ini.</div>
    <button class="btn" id="editTarget">Buat Target</button>
    ${db.targets[prevKey()]?'<div style="height:8px"></div><button class="btn sec" id="copyTarget">Salin target bulan lalu</button>':''}</div>`;
  const rows = KPI_DEF.map(d=>{
    const tv=t[d.k]||0, av=a[d.k]||0, p=pct(av,tv);
    return `<div class="kpi"><div class="top"><span>${d.label}</span><b>${d.f(av)} / ${d.f(tv)}</b></div>
      <div class="prog"><div style="width:${Math.min(p,100)}%;background:${progColor(p,d.budget)}"></div></div>
      <div class="note" style="margin-top:3px">${p.toFixed(0)}% ${d.budget?'terpakai':'tercapai'}</div></div>`;
  }).join('');
  const done = KPI_DEF.filter(d=>!d.budget && pct(a[d.k],t[d.k])>=100).length;
  return `<div class="card"><h2>Target ${BULAN[cur.m]} ${cur.y}</h2>
    <div class="note" style="margin-bottom:12px">${done} dari ${KPI_DEF.length-1} KPI sudah tercapai.</div>
    ${rows}
    <button class="btn sec" id="editTarget">Ubah Target</button></div>
    <div class="card"><h2>Angka aktual</h2><div class="note">Followers, reach, engagement, dan leads diisi manual tiap bulan (nanti bisa otomatis dari API). Jumlah posting dihitung dari konten berstatus "Terposting", dan data iklan dari menu Meta Ads.</div>
    <div style="height:10px"></div><button class="btn sec" id="editMetrics">Isi Angka Aktual</button></div>`;
}
function targetForm(){
  const key=curKey(), t=db.targets[key]||{};
  openSheet(`<h2>Target ${BULAN[cur.m]}</h2>
    ${KPI_DEF.map(d=>`<label>${d.label}</label><input type="number" step="any" id="t_${d.k}" value="${t[d.k]??''}">`).join('')}
    <div style="height:12px"></div><button class="btn" id="saveTarget">Simpan Target</button>`);
  $('#saveTarget').onclick=()=>{ const o={}; KPI_DEF.forEach(d=>o[d.k]=parseFloat($('#t_'+d.k).value)||0); db.targets[key]=o; save(); closeSheet(); render(); toast('Target tersimpan'); };
}
const MET_DEF=[['followers_ig','Followers Instagram (akhir bulan)'],['followers_tt','Followers TikTok (akhir bulan)'],['reach','Total Reach'],['impressions','Total Impressions'],['engagement','Total Engagement (like+komen+share+save)'],['leads','Leads / Inquiry']];
function metricsForm(){
  const key=curKey(), m=db.metrics[key]||{};
  openSheet(`<h2>Angka Aktual ${BULAN[cur.m]}</h2>
    ${MET_DEF.map(([k,l])=>`<label>${l}</label><input type="number" id="m_${k}" value="${m[k]??''}">`).join('')}
    <div style="height:12px"></div><button class="btn" id="saveMet">Simpan</button>`);
  $('#saveMet').onclick=()=>{ const o={}; MET_DEF.forEach(([k])=>o[k]=parseFloat($('#m_'+k).value)||0); db.metrics[key]=o; save(); closeSheet(); render(); toast('Angka tersimpan'); };
}

/* ================== View: Laporan ================== */
function delta(a,b){ if(!b) return '<span class="note">-</span>'; const d=(a-b)/b*100; return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span>`; }
function viewReport(){
  const seg = `<div class="seg"><button data-seg="bulanan" class="${reportSeg==='bulanan'?'active':''}">Laporan Bulanan</button><button data-seg="pencapaian" class="${reportSeg==='pencapaian'?'active':''}">Pencapaian</button></div>`;
  return seg + (reportSeg==='bulanan' ? reportMonthly() : reportAchieve());
}
function reportMonthly(){
  const key=curKey(), a=actuals(key), b=actuals(prevKey());
  if(!db.metrics[key]) return `<div class="card"><div class="empty-state">Angka bulan ini belum diisi.</div><button class="btn" id="editMetrics">Isi Angka Aktual</button></div>`;
  const posts=postsOf(key).filter(p=>p.status==='terposting');
  const byPlat = Object.keys(PLATFORM).map(k=>[PLATFORM[k],posts.filter(p=>p.platform===k).length]);
  const byPilar = PILAR.map(k=>[k,posts.filter(p=>p.pilar===k).length]).filter(x=>x[1]);
  const s = (l,v,d)=>`<div class="stat"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d} <span class="note">vs bln lalu</span></div></div>`;
  return `<div class="card"><h2>Ringkasan ${BULAN[cur.m]} ${cur.y}</h2>
    <div class="stats">
      ${s('Followers IG',fmt(a.followers_ig),delta(a.followers_ig,b.followers_ig))}
      ${s('Followers TikTok',fmt(a.followers_tt),delta(a.followers_tt,b.followers_tt))}
      ${s('Reach',fmt(a.reach),delta(a.reach,b.reach))}
      ${s('Impressions',fmt(a.impressions),delta(a.impressions,b.impressions))}
      ${s('Engagement',fmt(a.engagement),delta(a.engagement,b.engagement))}
      ${s('Engagement Rate',a.er.toFixed(2)+'%',delta(a.er,b.er))}
      ${s('Posting',fmt(a.posts),delta(a.posts,b.posts))}
      ${s('Leads',fmt(a.leads),delta(a.leads,b.leads))}
    </div></div>
    <div class="card"><h2>Posting per platform</h2>${barChart(byPlat)}
    <h3>Per content pillar</h3>${byPilar.length?barChart(byPilar):'<div class="note">Belum ada posting.</div>'}</div>
    <div class="card"><button class="btn" id="shareReport">Bagikan ringkasan ke chat</button><div style="height:8px"></div><button class="btn sec" id="editMetrics">Ubah Angka Aktual</button></div>`;
}
function barChart(rows){
  const max=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([l,v])=>`<div class="kpi" style="margin-bottom:8px"><div class="top"><span>${esc(l)}</span><b>${fmt(v)}</b></div><div class="prog"><div style="width:${v/max*100}%;background:var(--accent)"></div></div></div>`).join('');
}
function reportAchieve(){
  const key=curKey(), t=db.targets[key], a=actuals(key), b=actuals(prevKey());
  const items=[];
  if(t) KPI_DEF.forEach(d=>{ if(d.budget) return; const p=pct(a[d.k],t[d.k]); if(t[d.k]) items.push({e:p>=100?'🏆':p>=80?'🔥':'⏳',t:`${d.label}: ${d.f(a[d.k])}`,s:`${p.toFixed(0)}% dari target ${d.f(t[d.k])}`,ok:p>=100}); });
  const gainIg=a.followers_ig-b.followers_ig, gainTt=a.followers_tt-b.followers_tt;
  if(b.followers_ig && gainIg>0) items.push({e:'📈',t:`+${fmt(gainIg)} followers Instagram`,s:'pertumbuhan bulan ini',ok:true});
  if(b.followers_tt && gainTt>0) items.push({e:'📈',t:`+${fmt(gainTt)} followers TikTok`,s:'pertumbuhan bulan ini',ok:true});
  const as=adsSum(key); if(as.roas>=3) items.push({e:'💸',t:`ROAS iklan ${as.roas.toFixed(2)}x`,s:'iklan menghasilkan lebih dari 3x biaya',ok:true});
  const okN=items.filter(i=>i.ok).length;
  const score = t ? Math.round(KPI_DEF.filter(d=>!d.budget&&t[d.k]).reduce((s,d)=>s+Math.min(pct(a[d.k],t[d.k]),100),0)/KPI_DEF.filter(d=>!d.budget&&t[d.k]).length) : 0;
  return `<div class="card" style="text-align:center"><div class="note">Skor pencapaian ${BULAN[cur.m]}</div>
    <div style="font-size:44px;font-weight:800;color:${score>=100?'var(--ok)':score>=70?'var(--accent)':'var(--warn)'}">${t?score+'%':'-'}</div>
    <div class="note">${t?`rata-rata capaian semua KPI (maks 100% per KPI)`:'Buat target dulu di menu Target'}</div></div>
    <div class="card"><h2>Pencapaian (${okN})</h2>${items.length?items.map(i=>`<div class="ach"><div class="e">${i.e}</div><div><div style="font-weight:600">${esc(i.t)}</div><div class="note">${esc(i.s)}</div></div></div>`).join(''):'<div class="empty-state">Belum ada data.</div>'}</div>`;
}
function shareText(){
  const key=curKey(), a=actuals(key), as=adsSum(key);
  return `📊 Laporan ${BULAN[cur.m]} ${cur.y}\n\nFollowers IG: ${fmt(a.followers_ig)}\nFollowers TikTok: ${fmt(a.followers_tt)}\nReach: ${fmt(a.reach)}\nEngagement rate: ${a.er.toFixed(2)}%\nPosting: ${a.posts}\nLeads: ${fmt(a.leads)}\n\n💰 Meta Ads\nSpend: ${rp(as.spend)}\nHasil: ${fmt(as.results)}\nCPR: ${rp(as.cpr)}\nROAS: ${as.roas.toFixed(2)}x`;
}

/* ================== View: Meta Ads ================== */
function viewAds(){
  const key=curKey(), s=adsSum(key), p=adsSum(prevKey()), list=adsOf(key);
  const st=(l,v,d)=>`<div class="stat"><div class="l">${l}</div><div class="v" style="font-size:16px">${v}</div><div class="d">${d}</div></div>`;
  return `<div class="card"><h2>Meta Ads ${BULAN[cur.m]}</h2>
    <div class="stats">
      ${st('Total Spend',rp(s.spend),delta(s.spend,p.spend))}
      ${st('Hasil (results)',fmt(s.results),delta(s.results,p.results))}
      ${st('Cost per Result',rp(s.cpr),p.cpr?delta(p.cpr,s.cpr):'')}
      ${st('ROAS',s.roas.toFixed(2)+'x',delta(s.roas,p.roas))}
      ${st('CTR',s.ctr.toFixed(2)+'%',delta(s.ctr,p.ctr))}
      ${st('CPC',rp(s.cpc),p.cpc?delta(p.cpc,s.cpc):'')}
      ${st('CPM',rp(s.cpm),p.cpm?delta(p.cpm,s.cpm):'')}
      ${st('Reach',fmt(s.reach),delta(s.reach,p.reach))}
    </div><div class="note" style="margin-top:8px">Untuk biaya (CPR, CPC, CPM), ▲ hijau berarti makin murah.</div></div>
    <div class="card"><h2>Kampanye</h2>
    ${list.length?`<div style="overflow-x:auto"><table><tr><th>Kampanye</th><th class="n">Spend</th><th class="n">Hasil</th><th class="n">CPR</th><th class="n">CTR</th></tr>
      ${list.map(c=>`<tr data-ad="${c.id}" style="cursor:pointer"><td>${esc(c.name)}<div class="note">${esc(c.objective)}</div></td><td class="n">${fmt(Math.round(c.spend/1000))}rb</td><td class="n">${fmt(c.results)}</td><td class="n">${c.results?fmt(Math.round(c.spend/c.results/1000))+'rb':'-'}</td><td class="n">${pct(c.clicks,c.impressions).toFixed(2)}%</td></tr>`).join('')}
    </table></div>`:'<div class="empty-state">Belum ada kampanye bulan ini.</div>'}
    <div style="height:10px"></div><button class="btn" id="addAd">+ Tambah Kampanye</button></div>
    <div class="card"><div class="note">Sekarang data diisi manual (atau salin dari Ads Manager). Setelah disambungkan ke Meta Marketing API, angka ini bisa ditarik otomatis.</div></div>`;
}
function adForm(c){
  c=c||{name:'',objective:'Leads',spend:'',impressions:'',reach:'',clicks:'',results:'',revenue:''};
  const F=[['spend','Spend (Rp)'],['impressions','Impressions'],['reach','Reach'],['clicks','Klik link'],['results','Hasil (leads/pembelian/dll)'],['revenue','Pendapatan dari iklan (Rp, opsional)']];
  openSheet(`<h2>${c.id?'Edit':'Tambah'} Kampanye</h2>
    <label>Nama kampanye</label><input id="a_name" value="${esc(c.name)}">
    <label>Objective</label><select id="a_objective">${['Awareness','Traffic','Engagement','Leads','App Promotion','Sales'].map(o=>`<option ${o===c.objective?'selected':''}>${o}</option>`).join('')}</select>
    ${F.map(([k,l])=>`<label>${l}</label><input type="number" id="a_${k}" value="${c[k]}">`).join('')}
    <div style="height:12px"></div><button class="btn" id="saveAd">Simpan</button>
    ${c.id?'<button class="btn danger" id="delAd">Hapus kampanye</button>':''}`);
  $('#saveAd').onclick=()=>{ const o={name:$('#a_name').value.trim()||'Kampanye',objective:$('#a_objective').value,month:c.month||curKey()}; F.forEach(([k])=>o[k]=parseFloat($('#a_'+k).value)||0);
    if(c.id) Object.assign(db.ads.find(x=>x.id===c.id),o); else db.ads.push({id:uid(),...o}); save(); closeSheet(); render(); toast('Kampanye tersimpan'); };
  if(c.id) $('#delAd').onclick=()=>{ db.ads=db.ads.filter(x=>x.id!==c.id); save(); closeSheet(); render(); toast('Kampanye dihapus'); };
}

/* ================== View: Upload ==================
   Prototipe: belum benar-benar posting. Tombol "Posting" akan
   memanggil backend yang terhubung ke Instagram Graph API /
   TikTok Content Posting API setelah akses disetujui. */
let uploadDraft=null;
function viewUpload(){
  const ready = db.posts.filter(p=>p.status==='terjadwal'||p.status==='produksi').sort((a,b)=>a.date.localeCompare(b.date));
  const p = uploadDraft ? db.posts.find(x=>x.id===uploadDraft) : null;
  return `<div class="info"><b>Mode prototipe.</b> Posting langsung ke Instagram dan TikTok butuh akun dihubungkan dan izin dari Meta & TikTok. Sementara ini, tombol di bawah menyalin caption lalu membuka aplikasinya, jadi kamu tinggal tempel dan posting.</div>
  <div style="height:12px"></div>
  <div class="card"><h2>Siapkan postingan</h2>
    <label>Pilih konten dari kalender</label>
    <select id="u_post"><option value="">— pilih —</option>${ready.map(x=>`<option value="${x.id}" ${p&&p.id===x.id?'selected':''}>${tglIndo(x.date)} · ${PLATFORM[x.platform]} · ${esc(x.title)}</option>`).join('')}</select>
    <label>File foto/video</label><input type="file" id="u_file" accept="image/*,video/*">
    <div id="u_prev"></div>
    <label>Caption</label><textarea id="u_caption">${esc(p?p.caption:'')}</textarea>
    <label>Tujuan</label>
    <div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" id="u_ig" style="width:auto" ${!p||p.platform==='instagram'?'checked':''}> Instagram</label>
    <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" id="u_tt" style="width:auto" ${p&&p.platform==='tiktok'?'checked':''}> TikTok</label></div>
    <div style="height:14px"></div>
    <button class="btn" id="u_go">Salin caption & buka aplikasi</button>
    <div style="height:8px"></div>
    <button class="btn sec" id="u_api">Posting otomatis (butuh koneksi API)</button>
  </div>`;
}
function openApp(platform){
  const url = platform==='instagram' ? 'https://www.instagram.com/' : 'https://www.tiktok.com/upload';
  if(tg && tg.openLink) tg.openLink(url); else window.open(url,'_blank');
}

/* ================== Event binding ================== */
function bind(){
  document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{ selDay = selDay===el.dataset.day?null:el.dataset.day; render(); });
  document.querySelectorAll('[data-post]').forEach(el=>el.onclick=()=>postForm(db.posts.find(p=>p.id===el.dataset.post)));
  document.querySelectorAll('[data-ad]').forEach(el=>el.onclick=()=>adForm(db.ads.find(a=>a.id===el.dataset.ad)));
  document.querySelectorAll('[data-seg]').forEach(el=>el.onclick=()=>{ reportSeg=el.dataset.seg; render(); });
  const on=(id,fn)=>{ const e=$('#'+id); if(e) e.onclick=fn; };
  on('addPost',()=>postForm());
  on('clearDay',()=>{selDay=null;render();});
  on('editTarget',targetForm);
  on('copyTarget',()=>{ db.targets[curKey()]={...db.targets[prevKey()]}; save(); render(); toast('Target disalin'); });
  document.querySelectorAll('#editMetrics').forEach(e=>e.onclick=metricsForm);
  on('addAd',()=>adForm());
  on('shareReport',async()=>{
    const txt=shareText();
    if(tg && tg.switchInlineQuery){ try{ await navigator.clipboard.writeText(txt);}catch(e){} toast('Ringkasan disalin, tempel di chat'); }
    else { try{ await navigator.clipboard.writeText(txt); toast('Ringkasan disalin'); }catch(e){ openSheet(`<h2>Ringkasan</h2><textarea style="min-height:260px">${esc(txt)}</textarea>`); } }
  });
  const sel=$('#u_post');
  if(sel){
    sel.onchange=()=>{ uploadDraft=sel.value||null; render(); };
    $('#u_file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const u=URL.createObjectURL(f);
      $('#u_prev').innerHTML = f.type.startsWith('video') ? `<video class="preview" src="${u}" controls></video>` : `<img class="preview" src="${u}">`; };
    on('u_go',async()=>{
      const cap=$('#u_caption').value; try{ await navigator.clipboard.writeText(cap);}catch(e){}
      const ig=$('#u_ig').checked, tt=$('#u_tt').checked;
      if(!ig&&!tt) return toast('Pilih minimal satu tujuan');
      if(uploadDraft){ const p=db.posts.find(x=>x.id===uploadDraft); p.status='terposting'; p.caption=cap; save(); }
      toast('Caption disalin'); openApp(ig?'instagram':'tiktok');
    });
    on('u_api',()=>openSheet(`<h2>Posting otomatis</h2><div class="note" style="line-height:1.55">
      Fitur ini aktif setelah:<br><br>
      <b>Instagram</b>: akun Business/Creator yang terhubung ke Facebook Page, lalu aplikasi kita lolos App Review Meta untuk izin <i>instagram_content_publish</i>.<br><br>
      <b>TikTok</b>: aplikasi kita didaftarkan di TikTok for Developers dan disetujui untuk Content Posting API. Sebelum lolos audit, postingan hanya bisa berstatus privat.<br><br>
      Keduanya juga butuh server kecil (backend) untuk menyimpan token login dengan aman.</div>
      <div style="height:12px"></div><button class="btn" onclick="closeSheet()">Oke, mengerti</button>`));
  }
}

render();
</script>
</body>
</html>
